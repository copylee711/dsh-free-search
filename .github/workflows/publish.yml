# 发布到 npm（@copylee/dsh-free-search）
#
# 触发方式：
#   1. 推送版本 tag：先把 package.json、lib/index.js、lib/client.js 里的版本号改成同一个值并推到 master，
#      然后 `git tag v0.4.43 && git push origin v0.4.43`
#   2. 手动：Actions → Publish to npm → Run workflow（发布所选分支上 package.json 的当前版本）
#
# 认证（二选一）：
#   - Trusted Publishing（推荐，无需密钥）：npmjs.com → 包设置 → Trusted Publisher → GitHub Actions，
#     填 owner=copylee711、repository=dsh-free-search、workflow=publish.yml
#   - 访问令牌：仓库 Settings → Secrets and variables → Actions 新建 NPM_TOKEN（有发布权限的 Granular Access Token）
name: Publish to npm

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # Trusted Publishing / provenance 需要

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted Publishing 需要 npm >= 11.5.1
      - name: Update npm
        run: npm install -g npm@latest

      - name: Check versions and syntax
        id: check
        run: |
          node --check lib/index.js
          node -e "new Function(require('fs').readFileSync('lib/client.js', 'utf8'))"
          node <<'EOF'
          const fs = require("fs");
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const read = (file) => fs.readFileSync(file, "utf8").match(/const PLUGIN_VERSION = "([^"]+)"/)?.[1];
          const versions = { "package.json": pkg.version, "lib/index.js": read("lib/index.js"), "lib/client.js": read("lib/client.js") };
          const errors = [];
          if (new Set(Object.values(versions)).size !== 1) {
            errors.push(`version mismatch: ${JSON.stringify(versions)}`);
          }
          const ref = process.env.GITHUB_REF || "";
          if (ref.startsWith("refs/tags/") && ref.slice("refs/tags/v".length) !== pkg.version) {
            errors.push(`tag ${ref.slice("refs/tags/".length)} does not match package.json version ${pkg.version}`);
          }
          if (errors.length) {
            for (const e of errors) console.log(`::error::${e}`);
            process.exit(1);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `name=${pkg.name}\nversion=${pkg.version}\n`);
          EOF

      - name: Skip if already published
        id: exists
        run: |
          if npm view "${{ steps.check.outputs.name }}@${{ steps.check.outputs.version }}" version >/dev/null 2>&1; then
            echo "::notice::${{ steps.check.outputs.name }}@${{ steps.check.outputs.version }} is already on npm, skipping"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.exists.outputs.published == 'false'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
