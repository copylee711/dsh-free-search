# dsh-free-search — free web search providers (no API key needed)
# Registers the free-search plugin into ctx.web + a settings bridge
# (/api/dsh-free-search-settings) for the `web-search-free` entry's config.
# Engines and their priority are set on the web settings page:
#   sidebar Plugins page -> Official -> Web search (or the @copylee/dsh-free-search
#   detail page when the official search provider is off), DSH 0.1.7-rc.1+
# or with /free-search-engine in the chat, or by editing this entry's config, e.g.:
#   provider: bing            # preferred engine id, or auto (smart routing)
#   priorityMode: preferred   # preferred (preferred + fallback) | list (priority list)
# Failed/empty engines fall back to the next engine in the configured order.
# Also registers the switchable image tools image_search / page_images /
# save_images (image libraries, pictures extracted from web pages, download to
# the workspace); their results render as an image wall in the chat.
# A legacy ~/.dsh/settings.yaml "free-search:" section is migrated into this
# entry's config once at startup (see README).
# web.searchProvider must point at this plugin's provider id (ddg); the runtime
# also takes over when it is unset or still the shipped default
# (deepseek-official), and only warns when another provider was chosen explicitly.
- insert:
    - id: web-search-free
      name: "@copylee/dsh-free-search"
      config:
        provider: bing
        bingMarket: zh-CN
# 自动接管默认搜索：让 harness 的 web_search 直接用本插件的 provider（内部含全部引擎）
# 注意 patch 语义是"整行替换 config"（DSH 0.1.2+）：必须保留 fetchProvider，否则
# web-fetch-http 会被另一层重新注册，与 base bundle 的注册造成 duplicate loader entry。
- id: web
  config:
    searchProvider: ddg
    fetchProvider: http
